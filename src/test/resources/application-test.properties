# ============================================================================
# LogiTrack IQ - Configuración exclusiva para tests (@ActiveProfiles("test"))
# Usa H2 en memoria (modo compatibilidad PostgreSQL) para que los tests de
# integración NO dependan de la base de datos real de Supabase.
# Solo la usan los tests anotados con @SpringBootTest + @ActiveProfiles("test").
# Los tests unitarios puros (Mockito, sin @SpringBootTest) no la necesitan.
# ============================================================================

spring.datasource.url=jdbc:h2:mem:logitrack_iq_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y destruye el esquema automáticamente en cada corrida de test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.jpa.show-sql=false

# No usar los scripts schema.sql/data.sql pensados para PostgreSQL/Supabase
spring.sql.init.mode=never

# JWT de prueba (no se usa en los tests actuales porque se autentica con
# @WithMockUser, pero se deja configurado por si el contexto lo requiere)
jwt.secret=clave-secreta-solo-para-pruebas-automatizadas-0123456789abcdef
jwt.expiration-ms=3600000

spring.jackson.time-zone=America/Bogota
